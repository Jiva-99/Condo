  :root{
    --bg:#12141a; --surface:#191c23; --surface-raised:#21252e; --border:#2c313b;
    --text:#eceef1; --text-dim:#8b93a3; --text-faint:#7a8393;
    --gold:#c9a227; --gold-bright:#e6c158; --blue-bright:#3b82f6; --green:#22c55e; --pink:#ec4899;
    --red:#d9695f; --amber:#d98b3d; --violet:#a855f7;
    --good-bg:rgba(34,197,94,0.13); --bad-bg:rgba(217,105,95,0.15); --warn-bg:rgba(217,139,61,0.16); --gold-bg:rgba(201,162,39,0.14);
    --sans:'Ledger Sans', 'Noto Sans Thai', 'Leelawadee UI', 'Thonburi', Tahoma, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --serif:var(--sans); --mono:var(--sans); --radius:6px;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html,body{ min-height:100%; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; line-height:1.5; transition:background .15s, color .15s; }
  body[data-theme="light"]{
    --bg:#f6f4ef; --surface:#ffffff; --surface-raised:#efece3; --border:#dcd6c8;
    --text:#1d2026; --text-dim:#565f6f; --text-faint:#6d7684;
    --gold:#a9821f; --gold-bright:#8a6a15; --red:#c1453c; --amber:#a6631b; --green:#15803d; --blue-bright:#2563eb;
    --good-bg:rgba(21,128,61,0.10); --bad-bg:rgba(193,69,60,0.10); --warn-bg:rgba(166,99,27,0.12); --gold-bg:rgba(169,130,31,0.12);
  }
  ::selection{ background:var(--gold); color:#12141a; }
  a{ color:var(--gold-bright); }
  button,input,select,textarea{ font-family:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
  code{ font-size:12px; background:var(--surface-raised); padding:1px 5px; border-radius:4px; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- Shell (from Ledger) ---------- */
  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:210px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:20px 0; position:sticky; top:0; height:100vh; }
  .brand{ padding:0 20px 18px 20px; border-bottom:1px solid var(--border); margin-bottom:10px; display:flex; align-items:flex-start; gap:8px; }
  .brand-text{ flex:1; min-width:0; }
  .brand .mark{ font-family:var(--serif); font-size:22px; letter-spacing:0.5px; color:var(--gold-bright); }

const configured = !Object.values(FIREBASE_CONFIG).some(v => String(v).includes("PASTE_"));

async function initFirebase(){

  try{
    const [appM, authM, fsM] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-auth.js"), import(base+"firebase-firestore.js")]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    const auth = authM.getAuth(app);
    let db;
    try{ db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache({ tabManager: fsM.persistentMultipleTabManager() }) }); }
    catch(e){ db = fsM.getFirestore(app); }
    FB = { auth, db, provider: new authM.GoogleAuthProvider(), signInWithPopup: authM.signInWithPopup, signOut: authM.signOut,
      doc: fsM.doc, collection: fsM.collection, setDoc: fsM.setDoc, deleteDoc: fsM.deleteDoc, onSnapshot: fsM.onSnapshot };
    authM.onAuthStateChanged(auth, u => u ? startCloud(u) : stopCloud());
  }catch(e){ S.error = "Couldn't load Firebase. Working in this browser only."; updateSync(); }
}
function startCloud(user){
  stopCloud(true);
  S.user = user; S.error = "";
  const localCopy = { projects:{...S.projects}, units:{...S.units}, settings:{...S.settings} };
  const first = {}; let ready = false;
  const listen = kind => FB.onSnapshot(FB.collection(FB.db, "users", user.uid, kind), { includeMetadataChanges:true }, snap => {
    const map = {}; snap.docs.forEach(d => { map[d.id] = d.data(); });
    S.pending[kind] = snap.metadata.hasPendingWrites; first[kind] = map;
    if(!ready && KINDS.every(k => first[k])){
      ready = true; S.mode = "cloud";
      const cloudEmpty = !Object.keys(first.projects).length && !Object.keys(first.units).length;
      const hasLocal = Object.keys(localCopy.projects).length || Object.keys(localCopy.units).length;
      if(cloudEmpty && hasLocal){
        KINDS.forEach(k => { S[k] = {...localCopy[k], ...(k==="settings"?first.settings:{})}; Object.values(localCopy[k]).forEach(o => FB.setDoc(cloudRef(k, o.id), o).catch(cloudFail)); });
        toast("Uploaded the condos saved in this browser to your account.");
      } else KINDS.forEach(k => S[k] = first[k]);
    } else if(ready){ S[kind] = map; }
    if(ready) render(); else updateSync();
  }, cloudFail);
  unsubs = KINDS.map(listen);
  updateSync();
}
function stopCloud(keepData){
  unsubs.forEach(f => { try{ f(); }catch(e){} }); unsubs = [];

}
function updateSync(){

    if(!navigator.onLine){ state="offline"; text="Offline, changes kept on this device"; }
    else if(Object.values(S.pending).some(Boolean)){ state="saving"; text="Saving…"; }
    else { state="synced"; text="Synced"; }
  } else if(S.user){ state="saving"; text="Loading your condos…"; }
  else if(!configured) el.title = "Add your Firebase config to sync across devices (see README).";
  el.dataset.state = state; el.textContent = text;
  document.body.dataset.sync = state==="synced" ? "synced" : state==="error" ? "error" : S.user ? "saving" : "signedout";

}

/* =================== Calculations =================== */
const proj = u => S.projects[u.projectId] || {};
const fin = () => ({...DEF_FIN, ...(S.settings.finance||{})});
const weights = () => ({...DEF_W, ...(S.settings.weights||{})});
function incomeTHB(){
  const f = fin(), i = n(f.income); if(i===null) return null;
  return i;
}
function computed(u){
  const p = proj(u);
  const price=n(u.price), size=n(u.size), fee=n(p.commonFeeSqm), sink=n(p.sinkingFundSqm), units=n(p.totalUnits), lifts=n(p.lifts);
  return {
    pricePerSqm: price!==null && size ? price/size : null,
    monthlyFee: fee!==null && size!==null ? fee*size : null,
    sinkingTotal: sink!==null && size!==null ? sink*size : null,
    unitsPerLift: units!==null && lifts ? units/lifts : null,
  };
}
function pmt(P, ratePct, months){
  if(!(P>0) || !(months>0)) return 0;
  const r = ratePct/1200; if(!r) return P/months;
  return P*r/(1-Math.pow(1+r,-months));
}
// Fixed installment set at the 3-year average rate; interest accrues at each year's rate;
// after month 36 the remaining balance is re-amortised at the post-promo rate.
function loanCalc(loanAmt, o){
  const f = fin();
  const termY = n(o.term) ?? n(f.termYears) ?? 30, months = Math.round(termY*12);
  const yr = [n(o.y1), n(o.y2), n(o.y3)];
  const known = yr.filter(x=>x!==null);
  const avg = known.length ? known.reduce((a,b)=>a+b,0)/known.length : (n(f.defRate) ?? 0);
  const rates = yr.map(x => x ?? avg);
  const after = n(o.mrr)!==null ? n(o.mrr) - (n(o.spread)||0) : (n(f.afterRate) ?? avg);
  const pay = pmt(loanAmt, avg, months);
  let bal = loanAmt, interest3 = 0;
  const promoMonths = Math.min(36, months);
  for(let m=0; m<promoMonths; m++){ const i = bal*rates[Math.floor(m/12)]/1200; interest3 += i; bal = Math.max(0, bal + i - pay); }
  const payAfter = months>36 ? pmt(bal, after, months-36) : 0;
  const fees = (n(o.appraisal)||0) + (n(o.mrtaPrem)||0) + (n(o.otherFees)||0);
  const regFee = loanAmt*0.01;
  return { avg, after, pay, payAfter, bal, interest3, fees, regFee, upfrontFees: fees+regFee, cost3: pay*promoMonths + fees + regFee, termY };
}
function loanAmountOf(u){
  const price = n(u.price); if(price===null) return null;
  const f = fin(); const down = n(u.downPayment) ?? price*(n(f.minDownPct) ?? 20)/100;
  return { price, down, loan: Math.max(0, price-down) };
}
function offerFor(u){
  const la = loanAmountOf(u); const offers = (u.loans||[]);
  if(!la) return {offer:null, why:""};
  const chosen = offers.find(o=>o.chosen);
  if(chosen) return {offer:chosen, why:"your chosen offer"};
  if(offers.length){
    let best=null, bc=Infinity;
    offers.forEach(o=>{ const c=loanCalc(la.loan,o).cost3; if(c<bc){bc=c;best=o;} });
    return {offer:best, why:"lowest 3-year cost"};
  }
  return {offer:null, why:"your default rates in My finance"};
}
function deal(u){
  const la = loanAmountOf(u); if(!la) return null;
  const f = fin(), c = computed(u);
  const {offer, why} = offerFor(u);
  const lc = loanCalc(la.loan, offer||{});
  const shareMult = {Half:.5, All:1, None:0}[u.transferShare||"Half"] ?? .5;
  const transfer = la.price*0.02*shareMult;
  const other = n(u.otherTransferCosts)||0;
  const sinking = c.sinkingTotal||0;
  const loanFees = la.loan>0 ? lc.upfrontFees : 0;
  const upfront = la.down + transfer + other + sinking + loanFees;
  const inc = incomeTHB(), otherDebt = n(f.otherDebt)||0;
  const dti = inc ? (lc.pay+otherDebt)/inc*100 : null;
  const dtiAfter = inc ? (lc.payAfter+otherDebt)/inc*100 : null;
  const fee = c.monthlyFee||0;
  const savings = n(f.savings);
  return { ...la, lc, offer, why, transfer, other, sinking, loanFees, upfront,
    downPct: la.price ? la.down/la.price*100 : null,
    allIn: lc.pay + fee, allInAfter: lc.payAfter + fee, fee,
    dti, dtiAfter, dtiLimit: n(f.dtiLimit) ?? 35, minDown: n(f.minDownPct) ?? 20,
    shortfall: savings!==null ? upfront - savings : null,
    cost3: upfront + (lc.pay + fee)*36 };
}
function slotsMissing(u){
  const have = new Set((u.visits||[]).map(v=>v.slot));
  return SLOTS.slice(0,3).filter(s=>!have.has(s));
}
function flags(u){
  const p = proj(u), c = computed(u), d = deal(u), f = fin(), F = [];
  const R = t => F.push({lv:"red", t}), A = t => F.push({lv:"amber", t});
  if(p.eia==="no") R("EIA not approved: the project could be cancelled");
  else if(p.preSale==="yes" && p.eia!=="yes") A("Pre-sale and EIA approval not confirmed");
  if(p.preSale==="yes" && n(p.devFinance)!==null && n(p.devFinance)<=2) R("Pre-sale from a financially weak developer: risk it isn't finished");
  if(u.titleChecked==="no") R("Title deed problem: mismatch, mortgage or seizure");
  if(u.refundIfLoanRejected==="no") R("Deposit isn't refunded if your loan is rejected");
  if(u.unpaidBills==="yes") R("Unpaid water, electricity or common fees on the unit");
  if(f.credit==="Issues found") R("Credit bureau issues may block the loan");
  if(d){
    if(d.dti!==null && d.dti>d.dtiLimit) R(`Installment is ${pct(d.dti)} of income, above your ${d.dtiLimit}% limit`);
    if(d.dtiAfter!==null && d.dtiAfter>d.dtiLimit && !(d.dti>d.dtiLimit)) R(`After the promo period the installment rises to ${pct(d.dtiAfter)} of income`);
    if(d.downPct!==null && d.downPct < d.minDown - 0.01) R(`Down payment is ${pct(d.downPct)}, below your ${d.minDown}% minimum`);
    if(d.shortfall!==null && d.shortfall>0) R(`Cash needed up front is ${baht(d.shortfall)} more than your savings`);
  }
  if(["W","SW"].includes(u.orientation)) A(`Faces ${u.orientation}: hot afternoon sun`);
  if(u.nearLift==="yes") A("Next to the lift: noise");
  if(u.nearGarbage==="yes") A("Next to the garbage room: smell");
  if(u.nearCommon==="yes") A("Next to a common area: noise");
  if(c.unitsPerLift!==null && c.unitsPerLift>100) A(`About ${fmt(c.unitsPerLift)} units per lift: expect long waits`);
  if(u.leaksCracks==="yes") A("Leaks or wall cracks found");
  if(u.layoutMatches==="no") A("Real layout differs from the show room");
  if(p.feeArrears==="yes") A("Many owners behind on common fees");
  if(p.sinkingHealthy==="no") A("Low sinking fund balance");
  if(p.newSupply==="yes") A("Heavy new supply nearby may hold down resale prices");
  if(p.trafficJam==="yes") A("Traffic jam area");
  if(n(p.floodSafety)!==null && n(p.floodSafety)<=2) A("Flood risk");
  if(n(p.safetyNight)!==null && n(p.safetyNight)<=2) A("Feels unsafe at night");
  if(["Negotiating","Ready to sign"].includes(u.status) && slotsMissing(u).length) A(`Not yet visited: ${slotsMissing(u).join(", ").toLowerCase()}`);
  return F;
}
const COMPLETE_SKIP = new Set(["projectId","loc","label","status","rejectReason","notes","photos","links","downPayment","transferShare","otherTransferCosts","feeHistory","developer","area","station"]);
function completeness(u){
  const p = proj(u), missing = [];
  let total = 0, have = 0;
  const walk = (schema, obj, pre) => schema.forEach(s => s.fields.forEach(f => {
    if(COMPLETE_SKIP.has(f.k)) return;
    if(f.k==="unpaidBills" && u.secondHand==="no") return;
    total++;
    const v = obj[f.k];
    if(v!==undefined && v!==null && String(v)!=="") have++; else missing.push({l:f.l, where:pre});
  }));
  walk(UNIT_SCHEMA, u, "unit"); walk(PROJECT_SCHEMA, p, "project");
  if(!(u.visits||[]).length){ total++; missing.push({l:"At least one visit", where:"visits"}); } else { total++; have++; }
  return { pct: total ? Math.round(have/total*100) : 0, missing };
}
function checklistState(u){
  const items = CHECKLIST.map(it => {
    const na = it.secondHand && u.secondHand==="no";
    const autoTxt = it.auto ? it.auto(u) : "";
    const manual = !!(u.checklist||{})[it.k];
    return {...it, na, autoTxt, manual, done: na || manual || !!autoTxt};
  });

}
function statusError(u, st){

    const left = checklistState(u).left;
    if(left) return `Finish the checklist first: ${plural(left,"item")} left.`;
  }
  if(st==="Rejected" && !String(u.rejectReason||"").trim()) return "Add a reason for rejecting.";
  return "";
}

/* ---------- Scoring ---------- */
const triS = (v, good) => v==="yes" ? (good==="yes"?1:0) : v==="no" ? (good==="no"?1:0) : null;
const rateS = v => { const x=n(v); return x ? (x-1)/4 : null; };
const avgOf = arr => { const a = arr.filter(x=>x!==null && x!==undefined); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; };
const visitAvg = (u,k) => { const r = avgOf((u.visits||[]).map(v=>n(v[k])).filter(x=>x)); return r===null?null:(r-1)/4; };
const ORIENT_S = {N:1, NE:1, E:.7, SE:.6, S:.55, NW:.4, SW:.2, W:.1};
// [getter, kind] kind: low/high = relative across all units; abs = getter returns 0..1
const METRICS = {
  afford: [
    [u=>n(u.price),"low"], [u=>computed(u).pricePerSqm,"low"], [u=>deal(u)?.allInAfter,"low"], [u=>deal(u)?.upfront,"low"],
    [u=>{ const d=deal(u); if(!d||d.dtiAfter===null) return null; return clamp(1-(d.dtiAfter-0.6*d.dtiLimit)/(0.5*d.dtiLimit),0,1); },"abs"],
    [u=>{ const d=deal(u); return d&&d.downPct!==null ? (d.downPct>=d.minDown-0.01?1:0) : null; },"abs"],
  ],
  location: [
    [u=>n(proj(u).walkToStation),"low"], [u=>n(proj(u).commuteAM),"low"], [u=>n(proj(u).commutePM),"low"],
    [u=>avgOf((u.visits||[]).map(v=>n(v.commute))),"low"],
    [u=>triS(proj(u).trafficJam,"no"),"abs"], [u=>triS(proj(u).supermarket,"yes"),"abs"], [u=>triS(proj(u).sevenEleven,"yes"),"abs"], [u=>triS(proj(u).marketFood,"yes"),"abs"],
  ],
  surround: [
    ...["floodSafety","quiet","airSmell","safetyDay","safetyNight"].map(k=>[u=>rateS(proj(u)[k]),"abs"]),
    [u=>visitAvg(u,"quiet"),"abs"], [u=>visitAvg(u,"air"),"abs"], [u=>visitAvg(u,"light"),"abs"],
  ],
  unit: [
    [u=>n(u.size),"high"], [u=>n(u.bedrooms),"high"], [u=>n(u.bathrooms),"high"], [u=>n(u.ceiling),"high"],
    [u=>u.orientation ? ORIENT_S[u.orientation] : null,"abs"],
    ...["livingRoom","laundry","hanging","layoutMatches","compressorOk"].map(k=>[u=>triS(u[k],"yes"),"abs"]),
    ...["nearLift","nearGarbage","nearCommon","leaksCracks"].map(k=>[u=>triS(u[k],"no"),"abs"]),
  ],
  building: [
    [u=>computed(u).unitsPerLift,"low"], [u=>n(proj(u).parkingPct),"high"], [u=>n(proj(u).commonFeeSqm),"low"], [u=>n(proj(u).yearBuilt),"high"],
    ...["devTrack","devFinance","residentReviews"].map(k=>[u=>rateS(proj(u)[k]),"abs"]),
    [u=>triS(proj(u).sinkingHealthy,"yes"),"abs"], [u=>triS(proj(u).feeArrears,"no"),"abs"], [u=>triS(proj(u).eia,"yes"),"abs"],
    [u=>triS(u.titleChecked,"yes"),"abs"], [u=>triS(u.unpaidBills,"no"),"abs"],
  ],
  invest: [
    [u=>n(proj(u).rentalYield),"high"], [u=>rateS(proj(u).rentalDemand),"abs"], [u=>rateS(proj(u).resaleLiquidity),"abs"],
    [u=>triS(proj(u).newSupply,"no"),"abs"], [u=>triS(proj(u).foreignQuota,"yes"),"abs"],
  ],
};
let rangeCache = new Map();
function rangeOf(sec, i){
  const key = sec+":"+i; if(rangeCache.has(key)) return rangeCache.get(key);
  const [g] = METRICS[sec][i];
  const vals = Object.values(S.units).filter(u=>u.status!=="Rejected").map(u=>g(u)).filter(v=>v!==null && v!==undefined && isFinite(v));
  const r = vals.length ? [Math.min(...vals), Math.max(...vals)] : null;
  rangeCache.set(key, r); return r;
}
const scoreCache = new Map();
function scoreOf(u){
  if(scoreCache.has(u.id)) return scoreCache.get(u.id);
  const w = weights(), sections = {};
  let num = 0, den = 0;
  for(const s of SECTIONS){
    const parts = [];
    METRICS[s.k].forEach(([g, kind], i) => {
      const v = g(u); if(v===null || v===undefined || !isFinite(v)) return;
      if(kind==="abs"){ parts.push(v); return; }
      const r = rangeOf(s.k, i); if(!r) return;
      const [lo, hi] = r; if(hi===lo){ parts.push(1); return; }
      const t = (v-lo)/(hi-lo); parts.push(kind==="low" ? 1-t : t);
    });
    const sc = parts.length ? avgOf(parts)*5 : null;
    sections[s.k] = sc;
    if(sc!==null && (n(w[s.k])||0)>0){ num += sc*n(w[s.k]); den += n(w[s.k]); }
  }
  const res = { total: den ? Math.round(num/den*20) : null, sections };
  scoreCache.set(u.id, res); return res;
}
function scoreHtml(sc, big){
  if(sc===null) return `<span class="score na" title="Not enough data to score yet"><b>–</b><small>/100</small></span>`;
  const cls = sc>=70 ? "hi" : sc>=50 ? "mid" : "lo";
  return `<span class="score ${cls}" title="Weighted score"><b${big?' style="font-size:1.6rem"':""}>${sc}</b><small>/100</small></span>`;
}
function flagChips(fl){
  const r = fl.filter(x=>x.lv==="red").length, a = fl.length - r;
  return (r?`<span class="chip red">${plural(r,"red flag")}</span>`:"") + (a?`<span class="chip amber">${plural(a,"warning")}</span>`:"");
}

function orientClass(o){ return ["W","SW","NW"].includes(o) ? "warm" : ["N","NE"].includes(o) ? "cool" : ""; }
function orientNote(o){ return ["W","SW"].includes(o) ? "hot afternoon sun" : o==="NW" ? "some afternoon sun" : ["N","NE"].includes(o) ? "cooler" : ""; }
function compass(o){
  if(!o) return `<div class="compass" title="Facing not recorded"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="ring" cx="20" cy="20" r="17"/><text class="n" x="20" y="10" text-anchor="middle">N</text></svg><span>facing ?</span></div>`;
  const ang = ORIENT.indexOf(o)*45, note = orientNote(o);
  return `<div class="compass ${orientClass(o)}" title="Faces ${o}${note?", "+note:""}"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="ring" cx="20" cy="20" r="17"/><text class="n" x="20" y="10" text-anchor="middle">N</text><g transform="rotate(${ang} 20 20)"><path class="needle" d="M20 5 L25 22 L20 19 L15 22 Z"/></g></svg><span>${o}${note?"<br>"+note:""}</span></div>`;
}

function loansTab(u){

  if(!loans.length) return `<div class="empty"><p>Record offers from 3–4 banks for a ${baht(la.loan)} loan. Include the rates for years 1–3 and what happens after.</p>${addBtn}</div>`;
  const calcs = loans.map(o => loanCalc(la.loan, o));
  const {offer} = offerFor(u);
  const rows = [
    ["Year 1 / 2 / 3", (o)=>[o.y1,o.y2,o.y3].map(x=>isNum(x)?x+"%":"–").join(" / "), null],
    ["Average, first 3 years", (o,c)=>c.avg, "low", v=>pct(v,2)],

    ["3-year cost (payments + fees)", (o,c)=>c.cost3, "low", baht],

    ["MRTA required", (o)=>o.mrtaRequired==="yes"?"Yes":o.mrtaRequired==="no"?"No, optional":"Not sure", null],

  ];
  let h = `<div class="bar"><p class="muted small" style="margin:0">Loan amount ${baht(la.loan)}: price ${baht(la.price)} minus down payment ${baht(la.down)}.</p>${addBtn}</div>

  }

/* ---------- Compare ---------- */
function cmpRows(){
  const rows = [], sec = l => rows.push({sec:l}), add = (l, get, o={}) => rows.push({l, get, ...o});
  sec("Summary");
  add("Score", u=>scoreOf(u).total, {t:"num", better:"high"});
  add("Red flags", u=>flags(u).filter(x=>x.lv==="red").length, {t:"num", better:"low"});
  add("Warnings", u=>flags(u).filter(x=>x.lv==="amber").length, {t:"num", better:"low"});
  add("Complete", u=>completeness(u).pct, {t:"pct0", better:"high"});
  add("Project", u=>proj(u).name||"", {t:"text"});
  add("Status", u=>u.status||"Interested", {t:"text"});
  add("Price", u=>n(u.price), {t:"baht", better:"low"});
  add("Price per sqm", u=>computed(u).pricePerSqm, {t:"baht", better:"low"});
  add("Size (sqm)", u=>n(u.size), {t:"num1", better:"high"});
  add("Floor", u=>n(u.floor), {t:"num"});
  add("Facing", u=>u.orientation ? u.orientation + (orientNote(u.orientation)?", "+orientNote(u.orientation):"") : "", {t:"orient"});
  sec("Section scores (out of 5)");
  SECTIONS.forEach(s => add(s.l, u=>scoreOf(u).sections[s.k], {t:"num1", better:"high"}));
  sec("Money");
  add("Down payment", u=>deal(u)?.down, {t:"baht"});
  add("Loan amount", u=>deal(u)?.loan, {t:"baht", better:"low"});
  add("Installment, years 1–3", u=>deal(u)?.lc.pay, {t:"baht", better:"low"});
  add("Installment after year 3", u=>deal(u)?.lc.payAfter, {t:"baht", better:"low"});
  add("Common fee per month", u=>computed(u).monthlyFee, {t:"baht", better:"low"});
  add("All-in monthly, years 1–3", u=>deal(u)?.allIn, {t:"baht", better:"low"});
  add("All-in monthly after year 3", u=>deal(u)?.allInAfter, {t:"baht", better:"low"});
  add("Share of income, years 1–3", u=>deal(u)?.dti, {t:"pct", better:"low"});
  add("Share of income after year 3", u=>deal(u)?.dtiAfter, {t:"pct", better:"low"});
  add("Cash on transfer day", u=>deal(u)?.upfront, {t:"baht", better:"low"});
  add("Short of savings by", u=>{ const s=deal(u)?.shortfall; return s===null||s===undefined?null:Math.max(0,s); }, {t:"baht", better:"low"});
  add("3-year total cost", u=>deal(u)?.cost3, {t:"baht", better:"low"});
  add("Bank offers recorded", u=>(u.loans||[]).length, {t:"num", better:"high"});
  const skip = new Set(["projectId","label","status","rejectReason","price","size","floor","orientation","notes","photos","downPayment","transferShare","otherTransferCosts"]);
  for(const s of UNIT_SCHEMA){
    const fs = s.fields.filter(f=>!skip.has(f.k)); if(!fs.length) continue;
    sec(s.sec); fs.forEach(f => add(f.l, u=>u[f.k], fieldCmp(f)));
  }
  sec("Visits");
  add("Visits logged", u=>(u.visits||[]).length, {t:"num", better:"high"});
  add("Times still to visit", u=>slotsMissing(u).join(", ")||"None", {t:"text"});
  add("Average commute tested (min)", u=>avgOf((u.visits||[]).map(v=>n(v.commute))), {t:"num", better:"low"});
  add("Checklist items left", u=>checklistState(u).left, {t:"num", better:"low"});
  for(const s of PROJECT_SCHEMA){
    const fs = s.fields.filter(f=>!["name","notes","links","loc"].includes(f.k)); if(!fs.length) continue;
    sec("Project: " + s.sec); fs.forEach(f => add(f.l, u=>proj(u)[f.k], fieldCmp(f)));
    if(s.sec.startsWith("Building")) add("Units per lift", u=>computed(u).unitsPerLift, {t:"num", better:"low"});
  }
  sec("Photos & links");
  add("Unit photos", u=>u.photos||[], {t:"links"});
  add("Project links", u=>proj(u).links||[], {t:"links"});
  add("Unit notes", u=>u.notes||"", {t:"text"});
  return rows;
}
function fieldCmp(f){
  if(f.t==="num") return {t:"num1", better:f.better};
  if(f.t==="rate") return {t:"rate", better:"high"};
  if(f.t==="tri") return {t:"tri", good:f.good};
  return {t:"text"};
}
function cell(r, v){
  if(v===undefined) v = null;
  if(r.t==="baht") return v===null ? "" : baht(v);
  if(r.t==="num") return v===null ? "" : fmt(v);
  if(r.t==="pct") return v===null ? "" : pct(v);
  if(r.t==="pct0") return v===null ? "" : pct(v,0);
  if(r.t==="num1"){ const x=n(v); return x===null ? "" : fmt(x,2); }
  if(r.t==="rate"){ const x=n(v); if(!x) return ""; return `<span class="dots" aria-label="${x} of 5">${"●".repeat(x)}<s>${"●".repeat(5-x)}</s></span>`; }
  if(r.t==="tri"){
    if(v!=="yes" && v!=="no") return `<span class="unk">Not sure</span>`;
    const c = r.good ? (v===r.good ? "good" : "bad") : "";
    return `<span class="${c}">${v==="yes"?"Yes":"No"}</span>`;
  }
  if(r.t==="links") return (v||[]).filter(x=>safeUrl(x.url)).map(x=>`<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.label||x.cat||"Link")}</a>`).join("<br>");
  if(r.t==="orient"){ const o=(v||"").split(",")[0]; return v ? `<span style="color:${({warm:"var(--amber)",cool:"var(--blue-bright)"})[orientClass(o)]||"var(--text)"}">${esc(v)}</span>` : ""; }
  return esc(v);
}
function compareView(){
  const all = Object.values(S.units).sort((a,b)=>(proj(a).name||"").localeCompare(proj(b).name||"") || (a.label||"").localeCompare(b.label||""));
  if(all.length < 2) return `<div class="empty"><p>Add at least two units to compare them side by side.</p><button class="btn primary" data-act="new-unit">Add unit</button></div>`;
  compareSel = compareSel.filter(id => S.units[id]);
  const sel = compareSel.map(id => S.units[id]);
  let h = `<div class="bar"><h2>Compare</h2><span class="muted small">Tick units to add or remove columns.</span></div><div class="pick">`;
  h += all.map(u => `<label><input type="checkbox" data-cmp="${esc(u.id)}" ${compareSel.includes(u.id)?"checked":""}>${esc(u.label||"Unit")}<span class="muted small">${esc(proj(u).name||"")}</span></label>`).join("") + `</div>`;
  if(sel.length < 2) return h + `<div class="empty"><p>Pick at least two units above.</p></div>`;
  h += `<div class="legend"><span><i style="background:var(--good-bg)"></i>Best in row</span><span><i style="background:var(--bad-bg)"></i>Worst in row</span></div>`;
  h += `<div class="tablewrap"><table class="cmp"><thead><tr><th scope="col">&nbsp;</th>${sel.map(u=>`<th scope="col"><button class="btn link" data-open="${esc(u.id)}">${esc(u.label||"Unit")}</button><small>${esc(proj(u).name||"")}</small></th>`).join("")}</tr></thead><tbody>`;
  for(const r of cmpRows()){
    if(r.sec){ h += `<tr class="sec"><th scope="rowgroup">${esc(r.sec)}</th>${sel.map(()=>"<td></td>").join("")}</tr>`; continue; }
    const vals = sel.map(u => r.get(u));
    let best=null, worst=null;
    if(r.better){
      const nums = vals.map(v=>n(v)).filter(v=>v!==null && !(r.t==="rate" && v===0));
      if(nums.length>=2 && new Set(nums.map(x=>Math.round(x*100))).size>1){
        best = r.better==="low" ? Math.min(...nums) : Math.max(...nums);
        worst = r.better==="low" ? Math.max(...nums) : Math.min(...nums);
      }
    }
    h += `<tr><th scope="row">${esc(r.l)}</th>${vals.map(v => { const x=n(v); const c = best!==null&&x===best?"best":worst!==null&&x===worst?"worst":""; return `<td class="${c}">${cell(r,v)}</td>`; }).join("")}</tr>`;
  }
  return h + `</tbody></table></div>`;
}

/* =================== Forms =================== */
function fieldHtml(f, val, pf="f_"){
  const id = pf + f.k, req = f.req ? " required" : "";
  const wide = ["area","links"].includes(f.t) ? " wide" : "";
  const hint = f.hint && f.t!=="links" ? `<p class="hint">${esc(f.hint)}</p>` : "";
  let inner = "";
  if(f.t==="text" || f.t==="loc") inner = `<label for="${id}">${esc(f.l)}</label><input type="text" id="${id}" name="${f.k}" value="${esc(val)}"${req}>`;
  else if(f.t==="date") inner = `<label for="${id}">${esc(f.l)}</label><input type="date" id="${id}" name="${f.k}" value="${esc(val)}"${req}>`;
  else if(f.t==="num") inner = `<label for="${id}">${esc(f.l)}</label><input type="number" inputmode="decimal" step="any" id="${id}" name="${f.k}" value="${esc(val)}">`;
  else if(f.t==="area") inner = `<label for="${id}">${esc(f.l)}</label><textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`;
  else if(f.t==="select") inner = `<label for="${id}">${esc(f.l)}</label><select id="${id}" name="${f.k}">${f.noBlank?"":`<option value="">Not set</option>`}${f.opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  else if(f.t==="status") inner = `<label for="${id}">${esc(f.l)}</label><select id="${id}" name="${f.k}">${STATUS.map(o=>`<option ${o===(val||"Interested")?"selected":""}>${o}</option>`).join("")}</select>`;
  else if(f.t==="project") inner = `<label for="${id}">${esc(f.l)}</label><select id="${id}" name="${f.k}" required>${projList().map(p=>`<option value="${esc(p.id)}" ${p.id===val?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`;
  else if(f.t==="tri") inner = `<span class="lab" id="${id}">${esc(f.l)}</span><div class="seg" role="radiogroup" aria-labelledby="${id}">${[["yes","Yes"],["no","No"],["","Not sure"]].map(([v,l])=>`<label><input type="radio" name="${f.k}" value="${v}" ${(val||"")===v?"checked":""}><span>${l}</span></label>`).join("")}</div>`;
  else if(f.t==="rate") inner = `<span class="lab" id="${id}">${esc(f.l)}</span><div class="seg" role="radiogroup" aria-labelledby="${id}">${["1","2","3","4","5",""].map(v=>`<label><input type="radio" name="${f.k}" value="${v}" ${String(val??"")===v?"checked":""}><span>${v||"?"}</span></label>`).join("")}</div>`;
  else if(f.t==="links") inner = `<span class="lab">${esc(f.l)}</span><div class="links-list" data-links="${f.k}" data-cat="${f.cat?1:""}">${(val||[]).map(x=>linkRow(x, f.cat)).join("")}</div><div><button type="button" class="btn small" data-addlink="${f.k}">Add link</button></div>${f.hint?`<p class="hint">${esc(f.hint)}</p>`:""}`;
  return `<div class="f${wide}">${inner}${hint}</div>`;
}
function linkRow(x={}, cat){
  return `<div class="link-row${cat?" cat":""}"><input type="text" placeholder="Label" aria-label="Link label" value="${esc(x.label||"")}">${cat?`<select aria-label="Category">${PHOTO_CATS.map(c=>`<option ${c===(x.cat||"Other")?"selected":""}>${c}</option>`).join("")}</select>`:""}<input type="url" placeholder="https://drive.google.com/…" aria-label="Link address" value="${esc(x.url||"")}"><button type="button" class="btn small" data-dellink aria-label="Remove link">Remove</button></div>`;
}
function collect(root, schema, obj){
  for(const s of schema) for(const f of s.fields){
    if(f.t==="links"){
      obj[f.k] = [...root.querySelectorAll(`[data-links="${f.k}"] .link-row`)].map(r => {
        const ins = r.querySelectorAll("input"), sel = r.querySelector("select");
        const o = {label: ins[0].value.trim(), url: ins[1].value.trim()}; if(sel) o.cat = sel.value; return o;
      }).filter(x=>x.url||x.label);
      const bad = obj[f.k].find(x => x.url && !safeUrl(x.url));
      if(bad) return `“${bad.url}” isn't a web address. Links must start with https://`;
      if(obj[f.k].find(x => !x.url)) return "A link has a label but no address.";
    } else if(f.t==="tri" || f.t==="rate"){
      const c = root.querySelector(`[name="${f.k}"]:checked`); obj[f.k] = c ? c.value : "";
    } else {
      const el = root.querySelector(`[name="${f.k}"]`); obj[f.k] = el ? String(el.value).trim() : "";
    }
    if(f.req && !obj[f.k]) return `${f.l} is required.`;
  }
  return "";
}

const dlg = $("#dlg"), form = $("#dlgForm");
let ctx = null;
function openDialog({title, schema, obj, saveLabel="Save", onSave, onDelete, deleteLabel}){
  ctx = {schema, obj: JSON.parse(JSON.stringify(obj||{})), onSave, onDelete};
  let h = `<div class="dlg-h"><h2>${esc(title)}</h2><button type="button" class="btn small" data-close>Close</button></div><div class="dlg-b">`;

function editProject(p){

  const onDelete = isNew ? null : Object.assign(() => { unitsOf(p.id).forEach(u=>remove("units", u.id)); remove("projects", p.id); toast("Project deleted"); },
    { confirm: unitsOf(p.id).length ? `Delete project and its ${plural(unitsOf(p.id).length,"unit")}` : "Confirm delete" });

    onSave: o => {
      const raw = String(o.loc||"").trim();

      else { const ll = parseLatLng(raw); if(!ll) return "Couldn't find coordinates in that. Paste the full Google Maps link from the address bar (short maps.app.goo.gl links don't include them), or type them like 13.7563, 100.5018.";

function editUnit(u, pid, schema){

  openDialog({ title: isNew ? "Add unit" : schema ? "Edit purchase plan" : "Edit unit", schema: schema || UNIT_SCHEMA, obj: base, saveLabel: "Save unit",
    onSave: o => {
      const old = S.units[o.id];
      if(old && o.status !== old.status || isNew && o.status!=="Interested"){ const er = statusError(o, o.status); if(er) return er; }
      if(o.status==="Rejected" && !String(o.rejectReason||"").trim()) return "Add a reason for rejecting.";
      put("units", o); if(isNew){ setCompare(o.id, true); render(); } toast("Unit saved");
    },

    deleteLabel: "Delete unit" });
}
function editLoan(u, lid){
  const loans = (u.loans||[]).slice(); const existing = loans.find(l=>l.id===lid);
  openDialog({ title: existing ? "Edit bank offer" : "Add bank offer", schema: LOAN_SCHEMA, obj: existing || {id:uid()}, saveLabel: "Save offer",
    onSave: o => { const i = loans.findIndex(l=>l.id===o.id); if(i>=0) loans[i]=o; else loans.push(o); put("units", {...S.units[u.id], loans}); toast("Offer saved"); },
    onDelete: existing ? Object.assign(() => { put("units", {...S.units[u.id], loans: loans.filter(l=>l.id!==lid)}); toast("Offer deleted"); }, {confirm:"Confirm delete"}) : null,
    deleteLabel: "Delete offer" });

function editVisit(u, vid){
  const visits = (u.visits||[]).slice(); const existing = visits.find(v=>v.id===vid);
  const today = new Date(); const iso = new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
  openDialog({ title: existing ? "Edit visit" : "Log a visit", schema: VISIT_SCHEMA, obj: existing || {id:uid(), date: iso}, saveLabel: "Save visit",
    onSave: o => { const i = visits.findIndex(v=>v.id===o.id); if(i>=0) visits[i]=o; else visits.push(o);
      const cur = S.units[u.id]; const upd = {...cur, visits};
      if(!existing && (cur.status||"Interested")==="Interested") upd.status = "Visited";
      put("units", upd); toast(upd.status!==cur.status ? "Visit saved. Status moved to Visited." : "Visit saved"); },
    onDelete: existing ? Object.assign(() => { put("units", {...S.units[u.id], visits: visits.filter(v=>v.id!==vid)}); toast("Visit deleted"); }, {confirm:"Confirm delete"}) : null,
    deleteLabel: "Delete visit" });
}
function askRejectReason(u){
  openDialog({ title: "Reject this unit", schema: [{sec:"Why?", fields:[{k:"rejectReason", l:"Reason for rejecting", t:"text", req:true, hint:"Keeping reasons shows you what really matters to you."}]}], obj: {...u}, saveLabel: "Reject unit",
    onSave: o => { put("units", {...S.units[u.id], rejectReason:o.rejectReason, status:"Rejected"}); toast("Unit rejected"); } });
}
function setStatus(id, st, selEl){
  const u = S.units[id]; if(!u) return;
  if(st==="Rejected"){ if(selEl) selEl.value = u.status||"Interested"; askRejectReason(u); return; }

  put("units", {...u, status: st}); toast(`Moved to ${st}`);
}

const BKK = [13.7563, 100.5018];
function parseLatLng(raw){
  const s = String(raw);
  const num = "(-?\\d+(?:\\.\\d+)?)";
  const m = s.match(new RegExp("!3d"+num+"!4d"+num)) || s.match(new RegExp("@"+num+",\\s*"+num))
    || s.match(new RegExp("[?&](?:q|query|ll|destination|center)="+num+"(?:,|%2C)\\s*"+num, "i"))
    || s.match(new RegExp("^\\s*\\(?\\s*"+num+"\\s*[,\\s]\\s*"+num+"\\s*\\)?\\s*$"));
  if(!m) return null;
  let a = +m[1], b = +m[2];
  if(Math.abs(a)>90 || (a>95 && a<110 && b>0 && b<25)) [a,b] = [b,a];
  if(Math.abs(a)>90 || Math.abs(b)>180) return null;
  return [a, b];
}
const hasLoc = p => !!p && isNum(p.lat) && isNum(p.lng);
let mapEl = null, map = null, pinLayer = null, tiles = null, mapSel = null, pickPid = null, mapFitted = false, mapFocus = null, leafletP = null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletP) return leafletP;
  leafletP = new Promise((res, rej) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    sc.onload = () => res(); sc.onerror = () => { leafletP = null; sc.remove(); rej(new Error("leaflet")); };
    document.head.appendChild(sc);
  });
  return leafletP;
}
function parkMap(){ if(mapEl && mapEl.parentNode) mapEl.parentNode.removeChild(mapEl); }
function setTiles(){
  if(!map) return;
  // OpenStreetMap standard tiles: no API key needed. Dark mode darkens them with a CSS filter (see .tiles-dark).
  if(!tiles){
    tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, className:"osm-tiles",
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
  }
  mapEl.classList.toggle("tiles-dark", document.body.dataset.theme!=="light");
}
function mountMap(){
  const slot = $("#mapSlot"); if(!slot) return;
  if(!mapEl){ mapEl = document.createElement("div"); mapEl.id = "mapCanvas"; mapEl.setAttribute("aria-label", "Map of your condo projects"); }
  mapEl.classList.toggle("picking", !!pickPid);
  slot.appendChild(mapEl);
  loadLeaflet().then(() => {
    if(!map){
      map = L.map(mapEl, { zoomControl:true }).setView(BKK, 12);
      pinLayer = L.layerGroup().addTo(map);
      map.on("click", onMapClick);
    }
    setTiles();
    requestAnimationFrame(() => {
      map.invalidateSize(); drawPins();
      if(mapFocus){ const p = S.projects[mapFocus]; mapFocus = null; if(hasLoc(p)) map.setView([+p.lat, +p.lng], Math.max(map.getZoom(), 15)); }
    });
  }).catch(() => { slot.innerHTML = `<div class="empty"><p>Couldn't load the map. Check your connection, then open this tab again.</p></div>`; });
}
function bestOf(p){
  const us = unitsOf(p.id).filter(u => u.status!=="Rejected");
  const sc = us.map(u => scoreOf(u).total).filter(x => x!==null);
  return { us, best: sc.length ? Math.max(...sc) : null };
}
function pinClass(us, best){ return !us.length ? "none" : best===null ? "na" : best>=70 ? "hi" : best>=50 ? "mid" : "lo"; }
function drawPins(){
  if(!map) return;
  pinLayer.clearLayers();
  const pts = [];
  projList().filter(hasLoc).forEach(p => {
    const {us, best} = bestOf(p);
    const icon = L.divIcon({ className:"pin-wrap", iconSize:[34,34], iconAnchor:[17,17],
      html:`<div class="pin ${pinClass(us,best)}${p.id===mapSel?" sel":""}"><b>${best===null ? (us.length||"·") : best}</b></div>` });
    const m = L.marker([+p.lat, +p.lng], { icon, title:p.name, riseOnHover:true, zIndexOffset: p.id===mapSel ? 1000 : 0 }).addTo(pinLayer);
    m.bindTooltip(esc(p.name), { direction:"top", offset:[0,-18] });
    m.on("click", ev => { L.DomEvent.stopPropagation(ev); if(!pickPid) selectOnMap(p.id, false); });
    pts.push([+p.lat, +p.lng]);
  });
  if(!mapFitted && pts.length && !mapFocus){
    mapFitted = true;
    if(pts.length===1) map.setView(pts[0], 15); else map.fitBounds(pts, { padding:[40,40], maxZoom:15 });
  }
}
function selectOnMap(pid, pan=true){
  mapSel = pid; const p = S.projects[pid];
  if(pan && hasLoc(p)) mapFocus = pid;
  render();
}
function onMapClick(e){
  if(!pickPid) return;
  const p = S.projects[pickPid]; pickPid = null;
  if(!p){ render(); return; }
  const lat = +e.latlng.lat.toFixed(6), lng = +e.latlng.lng.toFixed(6);
  mapSel = p.id;
  put("projects", {...p, lat, lng, loc: lat.toFixed(6) + ", " + lng.toFixed(6)});
  toast("Location set for " + p.name);
}
function mapView(){
  const ps = projList();
  if(!ps.length) return `<div class="bar"><h2>Map</h2></div><div class="empty"><p>Add a project (building) and its location to see it on the map.</p><button class="btn primary" data-act="new-project">Add project</button></div>`;
  const sel = S.projects[mapSel];
  const placed = ps.filter(hasLoc).length;
  const rows = ps.map(p => {
    const {us, best} = bestOf(p);
    return `<button type="button" class="mrow${p.id===mapSel?" active":""}" data-mapsel="${esc(p.id)}">
      <span class="mdot ${hasLoc(p) ? pinClass(us,best) : "off"}"></span>
      <span class="mname">${esc(p.name)}<small>${esc([p.area, plural(unitsOf(p.id).length,"unit")].filter(Boolean).join(", "))}</small></span>
      <span class="mval">${hasLoc(p) ? (best===null ? "–" : best) : "No pin"}</span></button>`;
  }).join("");
  let detail = `<div class="panel"><p class="muted small" style="margin:0">Select a pin or a project to see its units.</p></div>`;
  if(sel){
    const us = unitsOf(sel.id);
    const facts = [sel.station && `${esc(sel.station)}${isNum(sel.walkToStation)?`, ${fmt(n(sel.walkToStation))} min walk`:""}`,
      isNum(sel.commuteAM) && `Morning commute ${fmt(n(sel.commuteAM))} min`,
      isNum(sel.commonFeeSqm) && `Common fee ${baht(n(sel.commonFeeSqm))} / sqm`].filter(Boolean);
    detail = `<div class="panel">
      <h3>${esc(sel.name)}</h3>
      <p class="muted small" style="margin:-4px 0 8px">${esc([sel.developer, sel.area].filter(Boolean).join(", ")) || "Developer and area not recorded"}</p>
      ${facts.length ? `<p class="small" style="margin:0 0 10px">${facts.join("<br>")}</p>` : ""}
      <div class="u-actions" style="margin-bottom:10px">
        <button class="btn small" data-act="edit-project" data-id="${esc(sel.id)}">Edit project</button>
        <button class="btn small" data-act="pick-loc" data-id="${esc(sel.id)}">${hasLoc(sel) ? "Move pin" : "Place on map"}</button>
        ${hasLoc(sel) ? `<a class="btn small" href="https://www.google.com/maps?q=${+sel.lat},${+sel.lng}" target="_blank" rel="noopener">Google Maps</a>` : ""}
        <button class="btn small" data-act="new-unit" data-pid="${esc(sel.id)}">Add unit</button>
      </div>
      ${us.length ? `<div class="munits">${us.map(u => { const fl = flags(u); return `<div class="mu" data-open="${esc(u.id)}" tabindex="0" role="button" aria-label="Open ${esc(u.label||"unit")}">
        <span class="mu-floor">${n(u.floor)!==null ? esc(u.floor) : "–"}</span>
        <span class="mu-main"><b>${esc(u.label||"Unit")}</b><small>${esc(u.status||"Interested")}${n(u.price)!==null ? ", " + baht(n(u.price)) : ""}</small>${fl.length ? `<span class="mu-flags">${flagChips(fl)}</span>` : ""}</span>
        ${scoreHtml(scoreOf(u).total)}</div>`; }).join("")}</div>` : `<p class="muted small" style="margin:0">No units recorded in this project yet.</p>`}
    </div>`;
  }
  return `<div class="bar"><h2>Map</h2><span class="muted small">${placed} of ${plural(ps.length,"project")} placed. The number on a pin is the best score in that building.</span></div>
  <div class="map-wrap">
    <div class="map-main">
      ${pickPid && S.projects[pickPid] ? `<div class="pickbar">Click the map where <b>${esc(S.projects[pickPid].name)}</b> is. <button class="btn small" data-act="cancel-pick">Cancel</button></div>` : ""}
      <div id="mapSlot"></div>
      <div class="map-legend"><span><i class="mdot hi"></i>70+</span><span><i class="mdot mid"></i>50–69</span><span><i class="mdot lo"></i>Below 50</span><span><i class="mdot na"></i>Not scored yet</span></div>
    </div>
    <div class="map-side">
      <div class="panel mlist"><h3>Projects</h3>${rows}</div>
      ${detail}
    </div>
  </div>`;
}

    "Weighted 0–100 score with weights you set, and a Pipeline board. Ready to sign needs a finished checklist.",
  ]},
  { no:"V1.1", name:"GitHub Pages and Firebase sync", date:"Sep 2026", current:false, items:[
    "Runs on GitHub Pages. Sign in with Google to sync through your own Firebase project, including offline edits.",
    "Works in the browser only until you sign in; data saved that way uploads the first time you do.",
    "Export and Import JSON for backups.",
  ]},
  { no:"V1.0", name:"Condo shortlist", date:"Sep 2026", current:false, items:[
    "Projects (buildings) and units, with the core fields from your checklist.",
    "Price per sqm, monthly common fee, sinking fund and units per lift worked out for you.",
    "Photo links for Google Drive.",
    "Compare units side by side with the best and worst value in each row highlighted.",
  ]},
];
function versionsView(){
  return `<div class="dash-head">
      <h2 class="page-title">Versions</h2>
      <span class="muted small">what has changed and when, newest first</span>
      <div class="spacer"></div>
      <label class="ver-search"><span class="sr-only">Search changes</span><input type="search" id="verSearch" placeholder="Search changes" autocomplete="off" value="${esc(verQuery)}"></label>
      <button type="button" class="btn" id="verToggleAll">Expand all</button>
    </div>
    <div class="ver-wrap"><div class="panel ver-card">
      ${VERSION_LOG.map((v,i) => `<details class="ver-item${v.current?" current":""}" data-ver="${i}" ${v.current?"open":""}>
        <summary><span class="ver-caret" aria-hidden="true"></span><span class="vno">${esc(v.no)}</span><span class="vname">${esc(v.name)}</span>
        ${v.current ? `<span class="chip savings">Current</span>` : ""}<span class="vcount muted">${plural(v.items.length,"change")}</span><span class="vdate muted">${esc(v.date)}</span></summary>
        <ul>${v.items.map(it => `<li>${esc(it)}</li>`).join("")}</ul></details>`).join("")}
      <div class="ver-foot muted" id="verCount"></div>
    </div>
    <p class="muted small">To record the next release, add an entry at the top of <code>VERSION_LOG</code> in the script and set <code>current</code> on it.</p></div>`;
}
let verQuery = "";
function applyVerSearch(){
  const items = [...document.querySelectorAll(".ver-item")]; if(!items.length) return;
  const q = verQuery.trim().toLowerCase();
  items.forEach(d => {
    const i = Number(d.dataset.ver);
    if(!q){ d.hidden = false; return; }
    const hit = d.textContent.toLowerCase().includes(q); d.hidden = !hit; d.open = hit;
  });
  verCount();
}
function verCount(){
  const items = [...document.querySelectorAll(".ver-item")], c = $("#verCount"), t = $("#verToggleAll"); if(!c) return;
  const shown = items.filter(d => !d.hidden);
  c.textContent = `Showing ${shown.length} of ${VERSION_LOG.length}`;
  if(t) t.textContent = shown.length && shown.every(d => d.open) ? "Collapse all" : "Expand all";
}
document.addEventListener("input", e => { if(e.target.id==="verSearch"){ verQuery = e.target.value; applyVerSearch(); } });
document.addEventListener("toggle", e => { if(e.target.classList && e.target.classList.contains("ver-item")) verCount(); }, true);
document.addEventListener("click", e => {
  if(e.target.id!=="verToggleAll") return;
  const vis = [...document.querySelectorAll(".ver-item")].filter(d => !d.hidden);
  const open = !vis.every(d => d.open); vis.forEach(d => d.open = open); verCount();
});

/* =================== Shell: theme, sidebar, drawer, More sheet =================== */
function applyTheme(t){
  document.body.dataset.theme = t;
  const b = $("#themeToggleBtn"); if(b) b.textContent = t==="light" ? "◑ Dark mode" : "☀ Light mode";
  try{ localStorage.setItem("condo-theme", t); }catch(e){}
  if(map) setTiles();
}
function closeDrawer(){
  $(".sidebar").classList.remove("drawer-open"); $("#drawerBackdrop").classList.remove("show");
  $("#mtbSheet").classList.remove("open");
}
$("#themeToggleBtn").addEventListener("click", () => applyTheme(document.body.dataset.theme==="light" ? "dark" : "light"));
$("#importBtn").addEventListener("click", () => $("#importFile").click());
$("#drawerOpenBtn").addEventListener("click", () => { $(".sidebar").classList.add("drawer-open"); $("#drawerBackdrop").classList.add("show"); });
$("#drawerBackdrop").addEventListener("click", closeDrawer);
$("#mtbMore").addEventListener("click", () => $("#mtbSheet").classList.toggle("open"));
$("#mtbSheet .sheet-back").addEventListener("click", closeDrawer);
function setCollapsed(on){
  document.body.classList.toggle("nav-collapsed", on);
  const b = $("#navToggle"); b.textContent = on ? "»" : "«"; b.setAttribute("aria-expanded", String(!on));
  b.setAttribute("aria-label", on ? "Expand sidebar" : "Collapse sidebar"); b.title = b.getAttribute("aria-label");
  try{ localStorage.setItem("condo-nav", on ? "1" : ""); }catch(e){}
  if(map) setTimeout(() => map.invalidateSize(), 50);
}
$("#navToggle").addEventListener("click", () => setCollapsed(!document.body.classList.contains("nav-collapsed")));
$("#appVer").textContent = "Condo " + APP_VERSION;
try{ applyTheme(localStorage.getItem("condo-theme") || "dark"); setCollapsed(localStorage.getItem("condo-nav")==="1"); }catch(e){ applyTheme("dark"); }

loadLocal();
render();
initFirebase();
})();
</script>
</body>
</html>
